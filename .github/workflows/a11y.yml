name: Accesibilidad y offline

# A4.6: axe-core sobre las pantallas principales (tema claro y oscuro) y el
# diálogo propio. Separado del deploy: un fallo acá avisa, no bloquea publicar.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  a11y:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Chromium para playwright-core
        run: npx playwright-core install --with-deps chromium
      - run: npm run test:a11y
      - run: npm run test:offline
