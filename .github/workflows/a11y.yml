name: Accesibilidad

# A4.6: axe-core sobre las pantallas principales (tema claro y oscuro) y el
# diálogo propio. Separado del deploy: un fallo acá avisa, no bloquea publicar.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  a11y:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Chromium para playwright-core
        run: npx playwright-core install --with-deps chromium
      - run: npm run test:a11y
