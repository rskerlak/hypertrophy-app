name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Corte del Plan P (D9): el dominio propio pasa al servidor; la demo
      # pública queda en rskerlak.github.io/hypertrophy-app, sin CNAME.
      - name: Build (static export en /hypertrophy-app)
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /hypertrophy-app
      # Deploy clásico por rama: más confiable que actions/deploy-pages
      # (el backend de deployments quedaba encolado indefinidamente).
      - name: Push out/ a la rama gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          force_orphan: true
